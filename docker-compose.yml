version: '3.8'

services:
  app-backend:
    build: 
      context: ./OnlineFirPortal.backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/onlinefir?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FIR_ENCRYPTION_KEY=${FIR_ENCRYPTION_KEY}
    depends_on:
      - db
    networks:
      - app-network

  app-frontend:
    build:
      context: ./OnlineFirPortal.frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      # The frontend rewrites /api/* to this base URL (see next.config.mjs)
      - API_BASE_URL=http://app-backend:4001
    depends_on:
      - app-backend
    networks:
      - app-network

  db:
    image: postgres:14-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=onlinefir
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert.pem:/etc/nginx/cert.pem:ro
      - ./key.pem:/etc/nginx/key.pem:ro
    depends_on:
      - app-frontend
      - app-backend
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
